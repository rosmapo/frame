[package]
name = "frame-app"
version = "0.33.1"
edition = "2024"
authors = ["Marek Jozwiak <hexthecoder@gmail.com>"]
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[[bin]]
name = "frame"
path = "src/main.rs"

[dependencies]
cpal = "0.18.1"
directories = "6.0.0"
frame-core = { path = "../frame-core" }
frame-updater = { path = "../frame-updater" }
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", features = ["font-kit"] }
image = "0.25.10"
notify-rust = "4.18.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.27"
smallvec = "1.15.1"
sysinfo = "0.31.4"
thiserror = "2.0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.12", default-features = false, features = ["async-io", "notification"] }
smol = "2.0"

[dev-dependencies]
gpui = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce", features = ["test-support"] }

[build-dependencies]
image = "0.25.10"

[lints]
workspace = true
